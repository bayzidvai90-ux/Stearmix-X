name: Build Streamix BD APK

on:
workflow_dispatch:
push:
branches:
- main

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout Code
    uses: actions/checkout@v4

  - name: Setup JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Setup Android SDK
    uses: android-actions/setup-android@v3

  - name: Install Android SDK
    run: |
      sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

  - name: Find ZIP
    id: find_zip
    run: |
      ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)
      if [ -z "$ZIP_FILE" ]; then
        echo "ERROR: No ZIP file found."
        exit 1
      fi
      echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"
      echo "Found: $ZIP_FILE"

  - name: Extract Android Project
    run: |
      rm -rf android-project
      mkdir android-project
      unzip -q "$ZIP_FILE" -d android-project

  - name: Locate Gradle Project
    run: |
      PROJECT_DIR=$(find android-project -type f -name "settings.gradle*" -o -name "build.gradle*" | head -n 1 | xargs -r dirname)

      if [ -z "$PROJECT_DIR" ] || [ ! -d "$PROJECT_DIR" ]; then
        echo "ERROR: Android Gradle project not found."
        find android-project -maxdepth 4 -type f | head -100
        exit 1
      fi

      echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      echo "Gradle project: $PROJECT_DIR"

  - name: Make Gradle Wrapper Executable
    working-directory: ${{ env.PROJECT_DIR }}
    run: |
      if [ -f "./gradlew" ]; then
        chmod +x ./gradlew
      else
        echo "ERROR: gradlew not found."
        exit 1
      fi

  - name: Build Debug APK
    working-directory: ${{ env.PROJECT_DIR }}
    run: |
      ./gradlew clean assembleDebug --stacktrace

  - name: Find APK
    id: apk
    run: |
      APK=$(find "${PROJECT_DIR}" -type f -name "*.apk" | head -n 1)

      if [ -z "$APK" ]; then
        echo "ERROR: APK not found."
        exit 1
      fi

      echo "APK=$APK" >> "$GITHUB_ENV"
      echo "APK found: $APK"

  - name: Upload Debug APK
    uses: actions/upload-artifact@v4
    with:
      name: Streamix-BD-Debug-APK
      path: ${{ env.APK }}
      if-no-files-found: error
